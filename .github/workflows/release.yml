# Main is published: a push that changes the version in package.json
# puts that version on npm and makes it a GitHub release.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "holon-md@$version" version >/dev/null 2>&1; then echo "published=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.version.outputs.published != 'true'
        run: pnpm install --frozen-lockfile && npm publish
      - if: steps.version.outputs.published != 'true'
        run: gh release create "v${{ steps.version.outputs.version }}" --title "holon ${{ steps.version.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
